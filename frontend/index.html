<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Trainer</title>
  <link rel="stylesheet" href="style.css?v=0.6.3">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-view="dashboard"><span class="brand-mark">♞</span> chess trainer</a>
    <nav class="nav" id="nav">
      <div class="nav-group" data-group="training">
        <span class="nav-group-title">Тренировка</span>
        <a href="#" data-view="task">Задача</a>
        <a href="#" data-view="opening">Дебюты</a>
        <a href="#" data-view="middlegame">Миттельшпиль</a>
      </div>
      <div class="nav-group" data-group="analysis">
        <span class="nav-group-title">Анализ</span>
        <a href="#" data-view="overview">Обзор</a>
        <a href="#" data-view="games">Партии</a>
        <a href="#" data-view="drills">Ошибки</a>
        <a href="#" data-view="coach">Анализ</a>
      </div>
      <div class="nav-group" data-group="progress">
        <span class="nav-group-title">Прогресс</span>
        <a href="#" data-view="dashboard">Дашборд</a>
        <a href="#" data-view="plan">План</a>
        <a href="#" data-view="progress">Прогресс</a>
        <a href="#" data-view="users">Профили</a>
        <a href="#" data-view="tools">Инструменты</a>
      </div>
    </nav>
    <div class="topbar-right">
      <div class="userbox" id="userbox"></div>
      <button type="button" class="theme-toggle" data-theme-toggle title="Переключить тему" aria-label="Переключить тему">☀</button>
    </div>
  </div>
</header>
<main class="page" id="app">
  <div class="app-boot" role="status" aria-live="polite">Загрузка…</div>
</main>
<noscript>
  <div class="page">
    <div class="alert alert-warn">Для работы Chess Trainer нужен JavaScript. Включите его в настройках браузера и обновите страницу.</div>
  </div>
</noscript>
<footer class="footer">Chess Trainer v0.6.3 · <a href="https://github.com/Tleukhanov/chess_trainig_app" target="_blank" rel="noopener">GitHub</a></footer>

  <script type="module" src="app.js?v=0.6.3"></script>
  <script>
    // Страховка: если приложение не отрисовалось, показать причину вместо пустой страницы.
    (function () {
      var app = document.getElementById('app');
      if (!app) return;

      function hasRenderedContent() {
        for (var i = 0; i < app.children.length; i++) {
          if (!app.children[i].classList.contains('app-boot')) return true;
        }
        return false;
      }

      function reportError(message) {
        if (hasRenderedContent()) return;
        app.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'alert alert-error app-error';
        box.textContent = 'Ошибка загрузки приложения: ' + message;
        app.appendChild(box);
      }

      window.addEventListener('error', function (event) {
        var message = event && event.message ? event.message : 'неизвестная ошибка';
        reportError(message);
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var message = reason && reason.message ? reason.message : String(reason || 'неизвестная ошибка');
        reportError(message);
      });
    })();
  </script>
</body>
</html>
